<!DOCTYPE html>
<html>
<head>
    <title>Cart Page</title>
</head>
<body>

    <h1 align="center">My Shopping Cart</h1>

    <table border="1" width="100%">
        <tr>
            <th>Book Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Amount</th>
        </tr>

        <tr>
            <td>Java 2</td>
            <td>500</td>
            <td>2</td>
            <td>1000</td>
        </tr>

        <tr>
            <td>HTML Basics</td>
            <td>300</td>
            <td>1</td>
            <td>300</td>
        </tr>

        <tr>
            <td colspan="3">Total Amount</td>
            <td>1300</td>
        </tr>
    </table>

</body>
</html>
